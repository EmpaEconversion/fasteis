[package]
name = "eis"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "eis"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25.0", features = ["num-complex"] }
num-complex = "0.4.6"
numpy = "0.25"
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
