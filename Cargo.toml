[package]
name = "fasteis"
version = "0.1.0-rc1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fasteis"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25.0", features = ["num-complex"] }
num-complex = "0.4.6"
numpy = "0.25"
rayon = "1.10"
levenberg-marquardt = "0.15.0"
nalgebra = "0.34"
argmin = "0.11.0"
argmin-math = { version = "0.5.1", features = ["vec"] }
rand = "0.9"
differential-evolution = "0.2.2"

[profile.release]
lto = "fat"
codegen-units = 1
