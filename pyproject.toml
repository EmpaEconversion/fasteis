[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "fasteis"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = ["numpy>=1.20"]
readme = "README.md"

[tool.maturin]
features = ["pyo3/extension-module"]

[dependency-groups]
docs = [
    "mkdocstrings[python]>=1.0.6; python_version >= '3.10'",
    "zensical>=0.0.53; python_version >= '3.10'",
]
dev = [
    { include-group = "docs" },
    "impedance>=1.7.1",
    "pandas>=2.0.3",
    "polars>=1.8.2",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "ruff>=0.15.20",
    "scipy>=1.10",
    "torch>=2.13; python_version >= '3.10'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

# The stubs needs docs
[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["PYI021", "N802"]
