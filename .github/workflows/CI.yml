# This file was generated by maturin v1.14.1
# The check-version job was added manually
name: CI

on:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - uses: astral-sh/setup-uv@v7
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Check tag matches Cargo.toml version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          uv run --no-project --python 3.12 --with packaging python - <<'EOF'
          import os, sys, tomllib
          from packaging.version import Version
          cargo = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if Version(cargo) != Version(tag.removeprefix("v")):
              print(f"::error::Tag {tag} does not match Cargo.toml version {cargo}")
              sys.exit(1)
          EOF

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: check-version
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
          retention-days: 1

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    needs: check-version
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
          retention-days: 1

  windows:
    runs-on: ${{ matrix.platform.runner }}
    needs: check-version
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist
          retention-days: 1

  macos:
    runs-on: ${{ matrix.platform.runner }}
    needs: check-version
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist
          retention-days: 1

  sdist:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist
          retention-days: 1

  cargo-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python_arch: x64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python_arch: arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - runner: windows-latest
            target: i686-pc-windows-msvc
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            python_arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            python_arch: x64
          - runner: macos-latest
            target: aarch64-apple-darwin
            python_arch: arm64
    steps:
      - uses: actions/checkout@v6
      # pyo3 links the test binary against this interpreter
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }}
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # Installs the built wheel, so this also tests packaging
  pytest:
    runs-on: ${{ matrix.runner }}
    needs: [linux, windows, macos]
    strategy:
      matrix:
        wheel: [linux-x86_64, linux-aarch64, windows-x64, windows-aarch64, macos-x86_64, macos-aarch64]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # Test dependencies have no windows-arm64 wheels before 3.11
        exclude:
          - wheel: windows-aarch64
            python: "3.8"
          - wheel: windows-aarch64
            python: "3.9"
          - wheel: windows-aarch64
            python: "3.10"
        include:
          - wheel: linux-x86_64
            runner: ubuntu-22.04
          - wheel: linux-aarch64
            runner: ubuntu-22.04-arm
          - wheel: windows-x64
            runner: windows-latest
          - wheel: windows-aarch64
            runner: windows-11-arm
          - wheel: macos-x86_64
            runner: macos-15-intel
          - wheel: macos-aarch64
            runner: macos-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-${{ matrix.wheel }}
          path: dist
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-default-groups --group test --no-install-project
      - run: uv pip install dist/*.whl
      - run: uv run --no-sync pytest tests

  # Test dependencies have no musllinux wheels before 3.10, or for aarch64
  pytest-musllinux:
    runs-on: ubuntu-22.04
    needs: musllinux
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: wheels-musllinux-x86_64
          path: dist
      - name: Test in Alpine
        run: |
          docker run --rm -v "$PWD":/io -w /io python:${{ matrix.python }}-alpine sh -ec '
            pip install --root-user-action=ignore uv
            uv sync --locked --no-default-groups --group test --no-install-project --python /usr/local/bin/python
            uv pip install dist/*.whl
            uv run --no-sync pytest tests
          '

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [check-version, linux, musllinux, windows, macos, sdist, cargo-test, pytest, pytest-musllinux]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
